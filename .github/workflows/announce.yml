name: Announce events on WhatsApp

on:
  schedule:
    - cron: "13 4 * * 0"   # Sun 09:43 IST - week-ahead post
    - cron: "47 13 * * 4"   # Thu 19:17 IST - teaching post
    - cron: "47 13 * * 2"   # Tue 19:17 IST - course post, only on dates in course-schedule.csv
                            # (keep all three in sync with SEND_DAYS in digest.py)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print messages without sending"
        type: boolean
        default: false
      test_send:
        description: "Test: really send the post for digest_date now, without logging it"
        type: boolean
        default: false
      digest_date:
        description: "Dry run / test send: act as if today were this date (YYYY-MM-DD, a Sun, Tue or Thu)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and send post
        env:
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WA_GROUP_IDS: ${{ secrets.WA_GROUP_IDS }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_MEDIA_URL: ${{ secrets.GREEN_API_MEDIA_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          DIGEST_DATE: ${{ inputs.digest_date }}
          TEST_SEND: ${{ inputs.test_send && '1' || '' }}
        run: python digest.py

      # Committing the log prevents duplicates and keeps the schedule alive
      # (GitHub disables scheduled workflows after 60 days without repo activity).
      - name: Commit sent log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent-log.csv 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Update sent log [skip ci]" && git push; }
