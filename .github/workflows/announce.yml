name: Announce events on WhatsApp

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST daily (GitHub may run it late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print messages without sending"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and send
        env:
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WA_GROUP_IDS: ${{ secrets.WA_GROUP_IDS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python announce.py

      # Committing the log prevents duplicates and keeps the schedule alive
      # (GitHub disables scheduled workflows after 60 days without repo activity).
      - name: Commit sent log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent-log.csv 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Update sent log [skip ci]" && git push; }
